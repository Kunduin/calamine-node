[package]
name = "calamine_node"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Asynchronous Calamine bindings for Node.js and Bun"
repository = "https://github.com/Kunduin/calamine-node"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calamine = "0.36.1"
napi = { version = "3.12.6", default-features = false, features = [
  "napi8",
  "dyn-symbols",
  "tokio_rt",
] }
napi-derive = "3.6.7"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "macros"] }

[build-dependencies]
napi-build = "2.4.3"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
